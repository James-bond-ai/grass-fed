name: Organic data refresh

# Monthly USDA Organic Integrity snapshot, published at the start of each month.
on:
  schedule:
    - cron: '17 14 3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: pip install pandas openpyxl
      - run: node scripts/organic/fetch.mjs
      - name: Slim the workbook to US certified operations
        run: |
          f=$(jq -r .file download.json); d=$(jq -r .date download.json)
          mkdir -p data/organic
          python scripts/organic/slim.py "$f" "$d" data/organic/us-operations.json
      - name: Match farms and commit
        run: |
          node scripts/organic/match.mjs data/organic/us-operations.json
          npm ci && npm run validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/organic/us-operations.json data/farms ops/organic-review.md
          git diff --cached --quiet || git commit -m "Organic Integrity snapshot $(jq -r .date download.json): refresh data and matches"
          git pull --rebase origin main && git push origin HEAD:main
