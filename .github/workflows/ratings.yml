name: Google ratings refresh

# Weekly, on Saturday morning Pacific time, before the Sunday Verifier and
# Monday Compliance runs. Needs the GOOGLE_PLACES_API_KEY repository secret;
# without it the job does nothing. scripts/ratings/google.mjs keeps usage
# inside Google's free monthly allowance.
on:
  schedule:
    - cron: '23 14 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/ratings/google.mjs
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings
          git diff --cached --quiet || git commit -m "Google ratings refresh $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main
