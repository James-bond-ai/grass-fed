name: Report a correction
description: Tell grassfed.food about an error in a farm listing or article.
title: "Correction: "
labels: ["correction"]
body:
  - type: input
    id: page
    attributes: { label: Page address, description: "The grassfed.food page with the error." }
    validations: { required: true }
  - type: textarea
    id: error
    attributes: { label: What's wrong, description: "What the page says and what it should say." }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Source, description: "A link that shows the correct information, if you have one." }
